{% load static %}

<html>

  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="{% static 'css/style.css'%}">
  </head>

  <body>

    <div class="main-wrap">
        <div class="main-html">
            <div class="container">
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    <strong>Сообщение:</strong> {{ message }}
                    <button type="button" class="close" data-dismiss="alert" aria-label="Закрыть">
                      <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                {% endfor %}
                
                <h3>Добро пожаловать на главную страницу!</h3>
                {% if user.is_authenticated %}
                    <h3>Здравствуйте, {{ username }}</h3>
                    <h4>Вы успешно вошли в систему.</h4> 
                    <div class="btn">  
                        <button type="submit"><a href="{% url 'signout' %}">Выйти</a></button>
                    </div>
                {% else %}
                    <div class="btn">
                        <button type="submit"><a href="{% url 'auth' 'login' %}">Войти</a></button>
                        <button type="submit"><a href="{% url 'auth' 'signup' %}">Зарегистрироваться</a></button>
                    </div>
                {% endif %}

            </div>
        </div>
    </div>
    
  </body>

</html>
